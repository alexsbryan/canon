[workspace]
members = ["crates/canon-core", "crates/canon-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-or-later"
repository = "https://github.com/alexsbryan/canon"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# The only network dependency in the tree. Blocking, so no async runtime
# enters a CLI that spends its life folding a file.
ureq = "3.4"
# ripgrep's directory walker. Taken off the shelf deliberately: a walk that
# does not follow symlinks out of the tree it was pointed at, does not abort
# on one unreadable directory, and does not block forever on a fifo is a
# decade of other people's bug reports, not thirty lines of ours.
ignore = "0.4"
# Argument validation only — the handlers still read `&[String]`. Lean
# features on purpose: no colour machinery, but `suggestions` is the point,
# because "unknown flag `--dry-runn`, did you mean `--dry-run`?" is the whole
# difference between a typo and a canon written to by accident.
# Randomness for `canon draw`, which sortition rests on. Off the shelf
# because `/dev/urandom` is a UNIX file: it made a sealed draw impossible on
# Windows, and this is one crate — `cfg-if` and `libc` are already here.
getrandom = "0.4"
clap = { version = "4", default-features = false, features = [
  "std",
  "error-context",
  "suggestions",
  "help",
  "usage",
] }
