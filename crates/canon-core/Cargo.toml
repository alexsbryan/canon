[package]
name = "canon-core"
description = "The canon fold: acts, content-addressed ids, and derivation of current state. No IO, no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The core compiles with no_std + alloc. The gate also checks its isolated
# dependency features: the CLI's std features must not mask a dependency here.
[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
